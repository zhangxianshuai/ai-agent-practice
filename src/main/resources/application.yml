server:
  port: 8088
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
spring:
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.7-plus
      # 👇 新增：显式指定 Embedding 模型
      embedding:
        options:
          model: text-embedding-v3
          dimensions: 1024
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: ""
          password: ""
        database-name: default
        collection-name: vector_store
        # ⚠️ 修改：维度要和上面配置的模型保持一致
        embedding-dimension: 1024
        index-type: IVF_FLAT
        metric-type: COSINE
        initialize-schema: true

dify:
  api-key: app-DIarjiRySxVlLoajBjXYuMIs # API 密钥
  base-url: http://localhost/v1        # 本地部署的 Dify 默认地址